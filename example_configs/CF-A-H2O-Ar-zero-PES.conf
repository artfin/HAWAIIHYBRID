&INPUT
    project_name = "test-h2o-ar-zero-pes"

    ! Free H2O rotor plus noninteracting Ar degrees of freedom.  
    PAIR_STATE        = ALL
    CALCULATION_TYPE  = CORRELATION_SINGLE
    TEMPERATURE       = 100.0
    pair_reduced_mass = 2.263150451346580e+04 ! H2O-Ar, a.u.

    so_potential = "GENERATE:ZERO"
    so_dipole.1 = "build/perm_dipole_h2o_ar.so"

    ! Demo settings; raise TOTAL_TRAJECTORIES and NITERATIONS for production.
    ! Correlation calculations must be launched under mpirun with at least two
    ! ranks, and TOTAL_TRAJECTORIES should be well above the rank count.
    NITERATIONS         = 10
    TOTAL_TRAJECTORIES  = 100
    CVODE_TOLERANCE     = 1e-12
    sampling_time       = 200.0
    MaxTrajectoryLength = 65536 

    pesmin = 0.0

    ! These bounds define the sampled spectator-Ar configuration volume.  The
    ! H2O rotational correlation itself is independent of this volume.
    sampler_Rmin = 4.5
    sampler_Rmax = 12.0

    hep_ppf_npoints     = 100_000
    hep_ppf_niterations = 5
    hep_m0_npoints      = 100_000
    hep_m0_niterations  = 5
    hep_m2_npoints      = 10_000
    hep_m2_niterations  = 5

    cf_filename = "CF-A-H2O-Ar-zero-PES-100.0.txt"

    ! With no interaction, Ar moves freely.  Keep Rcut far beyond the distance it
    ! can traverse during the finite trajectory so spectator escape cannot
    ! truncate the H2O correlation function.
    Rcut = 1.0e6
    accelerate_averaging = false
&END

&MONOMER
    MONOMER_TYPE = ROTOR

    II = { 4065.15542327822, 11618.1179974822, 7552.96257420394 } ! a.u.
&END

&MONOMER
    MONOMER_TYPE = ATOM
&END
