&INPUT
    project_name = "test-h2o-ar"

    PAIR_STATE        = BOUND
    CALCULATION_TYPE  = CORRELATION_SINGLE
    TEMPERATURE       = 100.0
    pair_reduced_mass = 2.263150451346580e+04 ! H2O-Ar, a.u.

    so_potential = "build/ai_pes_h2o_ar_nn.so"
    ! Only so_dipole.1 is given, so the driver aliases dipole_2 = dipole_1 and initializes
    ! the library once. Setting 'so_dipole' (or so_dipole.2) instead makes it load and
    ! initialize twice, which the Fortran DMS cannot survive: its module arrays are
    ! allocated on each dipole_init call.
    so_dipole.1  = "build/ai_ids_h2o_ar_nn.so"

    ! Trajectories are split as total_trajectories/niterations/_wsize and only ranks > 0
    ! run them, so this must be launched under mpirun with >= 2 ranks and the count kept
    ! well above the rank count. Demo settings; raise total_trajectories for production.
    NITERATIONS         = 1
    TOTAL_TRAJECTORIES  = 20
    CVODE_TOLERANCE     = 1e-12
    sampling_time       = 200.0
    MaxTrajectoryLength = 100

    pesmin = -6.411647154378e-04 ! = -140.72 cm-1

    sampler_Rmin = 4.5
    sampler_Rmax = 12.0

    hep_ppf_npoints = 100_000
    hep_ppf_niterations = 5

    hep_m0_npoints = 100_000
    hep_m0_niterations = 5

    hep_m2_npoints = 10_000
    hep_m2_niterations = 5

    cf_filename = "CF-B-H2O-Ar-100.0.txt"
    Rcut = 40.0
    accelerate_averaging = true
&END

&MONOMER
    MONOMER_TYPE = ROTOR

    ! RIGID H2O CONFIGURATION USED BY THIS TRAJECTORY CALCULATION
    ! -------------------------------------------------------------------------
    ! The bound-state spectrum is calculated with H2O represented as a rigid
    ! asymmetric rotor.  The geometry is not read from this configuration file:
    ! it is compiled into HAWAIIHYBRID through H2O_EQ_* in src/constants.h and is
    ! used by the H2O-Ar angular-to-Cartesian transformation passed to the PES and
    ! DMS shared libraries.  In the body-fixed frame, with the centre of mass at
    ! the origin, the current coordinates (bohr) are
    !
    !       O  = ( 0.000000000, 0.0,  0.124885194112977)
    !       H1 = ( 1.433735871, 0.0, -0.991247728887023)
    !       H2 = (-1.433735871, 0.0, -0.991247728887023).
    !
    ! Thus H2O lies in the xz plane, its C2 axis is the z axis, and the H side
    ! points toward -z.  The corresponding internal geometry is
    !
    !       r(OH)     = 1.816962094 bohr = 0.961495002 Angstrom,
    !       angle HOH = 104.200000 degrees.
    !
    ! The three moments below are the principal moments for this same rigid
    ! structure, in the order expected by the trajectory code.  They must remain
    ! consistent with H2O_EQ_*; changing II here does not change the Cartesian
    ! geometry seen by the PES or DMS.
    !
    ! PHYSICAL LIMITATION / FUTURE CORRECTION:
    ! This calculation uses a single equilibrium-like geometry associated with
    ! the minimum-geometry rigid-monomer approximation.  For a spectrum of the
    ! bound H2O-Ar complex, the preferable rigid representation would be an
    ! effective structure averaged over the isolated-H2O v=0 vibrational
    ! wavefunction, rather than the global minimum of the monomer PES.
    ! -------------------------------------------------------------------------

    ! MONOMER DIPOLE AT THE CURRENT RIGID GEOMETRY
    ! -------------------------------------------------------------------------
    ! Direct evaluation of the Schwenke-Partridge 2000 (SP2000) and Conway et
    ! al. 2018 CKAPTEN monomer DMS routines at the rigid geometry documented
    ! above gives
    !
    !       DMS                    dipole (a.u.)       dipole (D)
    !       SP2000                  0.7359507568         1.8706002
    !       CKAPTEN                 0.7307439648         1.8573659
    !       CKAPTEN - SP2000       -0.0052067919        -0.0132343
    !
    ! CKAPTEN is therefore 0.707 percent smaller than SP2000 at this geometry.
    ! The geometry used for this evaluation is
    !
    !       r(OH)     = 1.816962094 bohr = 0.961495002 Angstrom,
    !       angle HOH = 104.200000 degrees,
    !
    ! obtained from H2O_EQ_* in src/constants.h (the same constants are mirrored
    ! in H2O-Ar/free-and-quasibound-estimate/stage_a_final.py).  The C2 axis
    ! points toward the hydrogens along body-fixed -z.  Consequently the monomer
    ! dipole vectors in this body-fixed Cartesian frame are
    !
    !       mu_SP2000  = (0, 0, -0.7359507568) a.u.,
    !       mu_CKAPTEN = (0, 0, -0.7307439648) a.u.
    !
    ! In a laboratory-frame trajectory this body-fixed vector must be rotated
    ! with the instantaneous H2O orientation; its magnitude is constant only
    ! because the monomer is treated as rigid.
    !
    ! Nearby values around the current rigid geometry are
    !
    !       geometry                         SP2000/D    CKAPTEN/D    CK-SP/D
    !       current geometry                 1.8706002   1.8573659  -0.0132343
    !       angle(HOH) decreased by 1 deg    1.8852607   1.8720314  -0.0132292
    !
    ! Central finite-difference derivatives at the current geometry are
    !
    !       derivative                              SP2000          CKAPTEN
    !       d mu_parallel/d r_sym               0.465135 D/A    0.420905 D/A
    !       d mu_parallel/d angle             -0.0147488 D/deg -0.0147531 D/deg
    !       d mu_perp/d delta                    1.52641 D/A      1.47228 D/A
    !
    ! Here r1=r+delta and r2=r-delta for the asymmetric-stretch derivative.
    ! The bending dependence is essentially identical near this geometry.
    ! SP2000 has a systematically larger permanent dipole and about a 10 percent
    ! larger symmetric-stretch slope.
    !
    ! GEOMETRY/MINIMUM REFERENCE POINTS AVAILABLE IN THIS WORKSPACE
    !
    !       geometry/reference                         SP2000/D    CKAPTEN/D
    !       PS monomer PES global minimum:
    !         r=1.810045 bohr, angle=104.507646 deg     1.8643460   1.8512720
    !       SP2000 DMS fitting reference:
    !         r=1.811583930 bohr, angle=104.3475 deg    1.8670936   1.8539844
    !       CKAPTEN DMS fitting reference:
    !         r=1.8141 bohr, angle=104.52 deg           1.8651682   1.8519995
    !
    ! Only the first row above is a numerically determined monomer PES minimum.
    ! The SP2000 and CKAPTEN rows are expansion/reference geometries used by the
    ! respective DMS fits; they must not be described as minima of separate PESs.
    ! -------------------------------------------------------------------------

    II = { 4065.15542327822, 11618.1179974822, 7552.96257420394 } ! II(H2O), a.u.
&END

&MONOMER
    MONOMER_TYPE = ATOM
&END
