! Two requantization schemes of the same linear molecule (integer and half-integer angular
! momentum): still the same species, so the pair must be inferred to be identical.
&INPUT
    CALCULATION_TYPE = MANUAL
    PAIR_STATE = FREE_AND_METASTABLE
    TEMPERATURE = 300.0
    PROJECT_NAME = "tests/identical-monomers-requantized-both.conf.project"
&END

&MONOMER
    MONOMER_TYPE = LINEAR_MOLECULE_REQ_INTEGER
    II = {5.7079668371e+04, 5.7079668371e+04, 0.0} ! II(CO), a.u.
&END

&MONOMER
    MONOMER_TYPE = LINEAR_MOLECULE_REQ_HALFINTEGER
    II = {5.7079668371e+04, 5.7079668371e+04, 0.0} ! II(CO), a.u.
&END
