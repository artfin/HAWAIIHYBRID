! A linear molecule paired with the requantized form of the same molecule. Requantization is a
! choice of dynamics rather than a property of the species, so the pair must be inferred to be
! identical and the symmetry factor set to 0.5.
&INPUT
    CALCULATION_TYPE = MANUAL
    PAIR_STATE = FREE_AND_METASTABLE
    TEMPERATURE = 300.0
    PROJECT_NAME = "tests/identical-monomers-requantized-variant.conf.project"
&END

&MONOMER
    MONOMER_TYPE = LINEAR_MOLECULE
    II = {5.7079668371e+04, 5.7079668371e+04, 0.0} ! II(CO), a.u.
&END

&MONOMER
    MONOMER_TYPE = LINEAR_MOLECULE_REQ_INTEGER
    II = {5.7079668371e+04, 5.7079668371e+04, 0.0} ! II(CO), a.u.
&END
