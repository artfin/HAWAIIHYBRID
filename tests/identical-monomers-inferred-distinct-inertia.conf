! Two rotors of the same type but with different inertia tensors (H2O and NH3):
! the pair must be inferred to be distinct and the symmetry factor must stay at 1.0.
&INPUT
    CALCULATION_TYPE = MANUAL
    PAIR_STATE = FREE_AND_METASTABLE
    TEMPERATURE = 300.0
    PROJECT_NAME = "tests/identical-monomers-inferred-distinct-inertia.conf.project"
&END

&MONOMER
    MONOMER_TYPE = ROTOR
    II = { 4065.15542327822, 11618.1179974822, 7552.96257420394 } ! II(H2O), a.u.
&END

&MONOMER
    MONOMER_TYPE = ROTOR
    II = { 6403.05011416768, 6403.05011416768, 10041.4341478614 } ! II(NH3), a.u.
&END
