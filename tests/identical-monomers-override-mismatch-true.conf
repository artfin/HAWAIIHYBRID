! IDENTICAL_MONOMERS set to true for a pair inferred to be distinct: the mismatch must be
! reported and the user-provided value must win, giving a factor of 0.5.
&INPUT
    CALCULATION_TYPE = MANUAL
    PAIR_STATE = FREE_AND_METASTABLE
    TEMPERATURE = 300.0
    PROJECT_NAME = "tests/identical-monomers-override-mismatch-true.conf.project"
    IDENTICAL_MONOMERS = true
&END

&MONOMER
    MONOMER_TYPE = ROTOR
    II = { 4065.15542327822, 11618.1179974822, 7552.96257420394 } ! II(H2O), a.u.
&END

&MONOMER
    MONOMER_TYPE = ROTOR
    II = { 6403.05011416768, 6403.05011416768, 10041.4341478614 } ! II(NH3), a.u.
&END
