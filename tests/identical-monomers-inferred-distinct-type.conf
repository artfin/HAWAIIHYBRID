! A rotor paired with an atom: the differing monomer types alone make the pair distinct,
! so the symmetry factor must stay at 1.0.
&INPUT
    CALCULATION_TYPE = MANUAL
    PAIR_STATE = FREE_AND_METASTABLE
    TEMPERATURE = 300.0
    PROJECT_NAME = "tests/identical-monomers-inferred-distinct-type.conf.project"
&END

&MONOMER
    MONOMER_TYPE = ROTOR
    II = { 4065.15542327822, 11618.1179974822, 7552.96257420394 } ! II(H2O), a.u.
&END

&MONOMER
    MONOMER_TYPE = ATOM
&END
